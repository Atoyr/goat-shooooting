<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>goat-shooooting Visual Editor</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.5 Inter, "Yu Gothic UI", system-ui, sans-serif; background: #070b14; color: #e9f0ff; --panel: #101827; --line: #283650; --muted: #91a0ba; --accent: #55d6be; --danger: #ff7185; --warning: #ffd166; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button, input, select { border: 1px solid #3a4b6b; border-radius: 7px; background: #172238; color: inherit; padding: 7px 10px; }
    button { cursor: pointer; }
    button:hover { background: #223353; border-color: #57709d; }
    button.primary { color: #071312; background: var(--accent); border-color: var(--accent); font-weight: 700; }
    button.danger { color: #ffdfe4; border-color: #7b3545; }
    header { height: 64px; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #0b111e; border-bottom: 1px solid var(--line); }
    .brand { margin-right: auto; }
    .brand strong { display: block; font-size: 17px; letter-spacing: .02em; }
    .brand small { color: var(--muted); }
    #path { width: min(320px, 25vw); }
    .mode-switch { display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: #090f1b; }
    .mode-switch button { border: 0; background: transparent; padding: 5px 12px; }
    .mode-switch button.active { background: #294568; color: white; }
    main { display: grid; grid-template-columns: 230px minmax(440px, 1fr) 320px; height: calc(100vh - 104px); }
    aside { min-width: 0; overflow: auto; padding: 14px; background: var(--panel); }
    #library { border-right: 1px solid var(--line); }
    #inspector { border-left: 1px solid var(--line); }
    h2, h3, p { margin-top: 0; }
    h2 { margin-bottom: 4px; font-size: 16px; }
    h3 { margin: 18px 0 7px; color: #b8c7df; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .file-group { margin-bottom: 14px; }
    .file-group-title { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; margin: 8px 7px 4px; text-transform: uppercase; }
    .file-button { width: 100%; display: flex; gap: 8px; align-items: center; border: 0; background: transparent; text-align: left; overflow: hidden; }
    .file-button.active { background: #23466b; }
    .file-button span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kind-icon { width: 21px; text-align: center; color: var(--accent); }
    .new-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin-bottom: 14px; }
    #workspace { position: relative; min-width: 0; overflow: auto; background: radial-gradient(circle at 50% 20%, #16213a, #080d18 65%); }
    #visualView { min-height: 100%; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    #visualView.hidden, #jsonView.hidden { display: none; }
    .canvas-shell { width: min(100%, 920px); min-height: 420px; flex: 1; display: flex; align-items: center; justify-content: center; position: relative; border: 1px solid #344766; border-radius: 12px; overflow: hidden; background: #050812; box-shadow: 0 18px 60px #0008; }
    canvas { display: block; width: 100%; height: 100%; min-height: 420px; touch-action: none; }
    .canvas-help { position: absolute; left: 12px; bottom: 10px; color: #a9bad5; background: #070b14cc; border-radius: 6px; padding: 4px 8px; pointer-events: none; }
    .stage-tools { width: min(100%, 920px); display: flex; align-items: center; gap: 8px; }
    .stage-tools strong { margin-right: auto; }
    #timeline { width: min(100%, 920px); height: 74px; position: relative; border: 1px solid var(--line); border-radius: 9px; background: #0d1524; overflow: hidden; }
    #timeline::before { content: "0s"; position: absolute; left: 7px; bottom: 3px; color: var(--muted); font-size: 10px; }
    #timelineEnd { position: absolute; right: 7px; bottom: 3px; color: var(--muted); font-size: 10px; }
    .timeline-event { position: absolute; top: 12px; width: 24px; height: 28px; padding: 0; transform: translateX(-50%); border-radius: 5px; background: #2f7bbb; border-color: #73baff; font-size: 11px; font-weight: 700; }
    .timeline-event.active { background: var(--warning); border-color: #fff0a5; box-shadow: 0 0 0 3px #ffd16638; }
    .timeline-time { position: absolute; top: 32px; left: 50%; transform: translateX(-50%); color: #aebdd4; font-size: 10px; font-weight: 400; white-space: nowrap; }
    .multi-track { width: min(100%, 920px); border: 1px solid var(--line); border-radius: 9px; background: #0d1524; overflow: hidden; }
    .track-lane { display: grid; grid-template-columns: 120px 1fr; min-height: 48px; border-top: 1px solid var(--line); }
    .track-lane:first-child { border-top: 0; }
    .track-name { padding: 9px; color: #b8c7df; background: #111c2e; font-size: 12px; }
    .track-name small { display: block; color: var(--muted); }
    .track-events { position: relative; min-height: 48px; background-image: linear-gradient(90deg, #ffffff0a 1px, transparent 1px); background-size: 10% 100%; }
    .track-node { position: absolute; top: 9px; min-width: 24px; max-width: 110px; height: 28px; padding: 3px 6px; transform: translateX(-50%); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 5px; background: #2f7bbb; border-color: #73baff; font-size: 10px; }
    .track-lane[data-kind="environment"] .track-node { background: #26785d; }
    .track-lane[data-kind="camera"] .track-node { background: #7254a8; }
    .track-lane[data-kind="audio"] .track-node { background: #9a652d; }
    .track-lane[data-kind="ui"] .track-node { background: #8e4b6c; }
    .track-lane[data-kind="route"] .track-node { background: #4f607c; }
    #jsonView { height: 100%; padding: 14px; }
    #content { resize: none; width: 100%; height: 100%; border: 1px solid #405177; border-radius: 8px; background: #080e1b; color: #dce8ff; padding: 16px; font: 14px/1.6 Consolas, monospace; tab-size: 2; }
    .empty-state { margin: auto; max-width: 440px; padding: 28px; color: var(--muted); text-align: center; }
    .empty-state strong { color: white; display: block; font-size: 19px; margin-bottom: 8px; }
    #inspectorHeader { color: var(--muted); margin-bottom: 14px; overflow-wrap: anywhere; }
    .field { margin-bottom: 13px; }
    .field label { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 5px; color: #cad6e9; font-weight: 650; }
    .field label small { color: var(--muted); font-weight: 400; }
    .field input, .field select, .field textarea { width: 100%; }
    .field textarea { min-height: 96px; resize: vertical; border: 1px solid #3a4b6b; border-radius: 7px; background: #0b1322; color: inherit; padding: 7px; font: 12px/1.5 Consolas, monospace; }
    .field .description { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .event-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin: 16px 0; }
    .preview-tools { width: min(100%, 920px); display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .preview-tools input, .preview-tools select { width: 118px; }
    .preview-stats { width: min(100%, 920px); display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
    .preview-stats span, .trace { padding: 8px; border: 1px solid var(--line); border-radius: 7px; background: #0d1524; }
    .trace { width: min(100%, 920px); max-height: 150px; overflow: auto; color: var(--muted); font: 12px/1.5 Consolas, monospace; }
    .workbench { width: min(100%, 920px); border: 1px solid var(--line); border-radius: 10px; background: #0d1524; padding: 12px; }
    .workbench-tools { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
    .node-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 9px; }
    .graph-node { display: block; border: 1px solid #3b5277; border-radius: 8px; background: #15233a; padding: 9px; }
    .graph-node.selected { border-color: var(--warning); box-shadow: 0 0 0 2px #ffd16633; }
    .graph-node small { display: block; color: var(--muted); }
    .live-grid { width: min(100%, 920px); display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .collection { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 10px; }
    .collection-row { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
    .collection-row:first-child { border-top: 0; margin-top: 0; }
    .required { color: var(--warning); }
    details { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 10px; }
    summary { cursor: pointer; color: var(--muted); }
    .schema-field { border-bottom: 1px solid #26324d; padding: 8px 0; color: var(--muted); font-size: 12px; }
    .schema-field code { color: #72d6ff; }
    footer { height: 40px; display: flex; align-items: center; padding: 0 16px; border-top: 1px solid var(--line); background: #0b111e; color: var(--muted); }
    footer.ok { color: #77e39b; }
    footer.error { color: #ff8c8c; }
    .dirty::after { content: " ●"; color: var(--warning); }
    @media (max-width: 980px) { main { grid-template-columns: 190px 1fr; } #inspector { position: fixed; z-index: 5; right: 0; top: 64px; bottom: 40px; width: 300px; box-shadow: -10px 0 30px #0008; } #workspace { margin-right: 300px; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><strong>goat-shooooting Visual Editor</strong><small>見て、動かして、ゲームを作る</small></div>
    <div class="mode-switch" aria-label="編集モード"><button id="visualMode" class="active">ビジュアル</button><button id="jsonMode">JSON</button></div>
    <input id="path" aria-label="JSON path" placeholder="enemies/new-enemy.json">
    <button id="undo" title="Undo (Ctrl+Z)">↶</button><button id="redo" title="Redo (Ctrl+Y)">↷</button><button id="reload">再読込</button><button id="rename">ID変更</button><button id="duplicate">複製</button><button id="delete" class="danger">削除</button><button id="validate">検証</button><button id="save" class="primary">保存</button>
  </header>
  <main>
    <aside id="library">
      <h2>ゲーム素材</h2><p style="color:var(--muted);font-size:12px">編集する素材を選択</p>
      <div class="new-row"><select id="newType" aria-label="新規Definition種別"><option value="program">Program v3</option><option value="variant">Variant v3</option><option value="parameter-set">Parameter Set v3</option><option value="interaction">Interaction v3</option><option value="resource">Resource v3</option><option value="rule">Rule v3</option><option value="state-machine">State Machine v3</option><option value="actor">Actor v3</option><option value="enemy">敵</option><option value="bullet">弾</option><option value="weapon">武器</option><option value="stage">ステージ</option><option value="stage-program">Stage Program v3</option><option value="effect">Effect Recipe v3</option><option value="animation-state">Animation State v3</option><option value="ship">Ship v2</option><option value="projectile">Projectile v2</option><option value="item">Item v2</option><option value="pattern">Pattern v2</option><option value="boss">Boss v2</option><option value="ruleset">RuleSet v2</option><option value="difficulty">Difficulty v2</option><option value="visual">Visual v2</option><option value="audio">Audio v2</option></select><button id="new">＋ 新規</button></div>
      <div id="files"></div>
    </aside>
    <section id="workspace"><div id="visualView"><div class="empty-state"><strong>素材を選んでください</strong>左の一覧からDefinitionを選ぶと、production Runtimeによるプレビューが表示されます。</div></div><div id="jsonView" class="hidden"><textarea id="content" spellcheck="false" aria-label="JSON content"></textarea></div></section>
    <aside id="inspector"><h2 id="inspectorTitle">プロパティ</h2><div id="inspectorHeader">素材を選択すると、設定項目が表示されます。</div><div id="form"></div><details><summary>フィールド仕様</summary><div id="schema"></div></details></aside>
  </main>
  <footer id="status">Definitionを選択してください。</footer>
  <script>

    const ui = Object.fromEntries(ids.map(id => [id, document.querySelector(`#${id}`)]));
    const labels = { id: 'ID', playerId: 'プレイヤー', stageId: '開始ステージ', stageProgramId: 'Stage Program', width: 'プレイ領域の幅', height: 'プレイ領域の高さ', screenLayout: '画面レイアウト', hudPanelWidth: 'HUDパネル幅', scorePosition: 'スコア位置', hp: 'HP', lives: '残機', bombs: 'ボム数', bombDamage: 'ボムダメージ', speed: '速度', weaponId: '武器', projectileId: 'Projectile', visualId: 'Visual', audioId: 'Audio', bgmAudioId: 'BGM', bossId: 'Boss', x: 'X座標', y: 'Y座標', radius: '当たり判定半径', invincibilitySeconds: '無敵時間（秒）', score: 'スコア', movementPattern: '移動パターン', motionPatternId: 'Motion pattern', attackPatternIds: 'Attack timeline', movementAmplitude: '左右の振れ幅', movementFrequency: '振動数', bulletId: '弾', cooldown: '発射間隔（秒）', projectileCount: '同時発射数／渦の腕数', spreadDegrees: '拡散角度', firePattern: '弾幕パターン', rotationDegreesPerShot: '1発射ごとの回転角', rotationSwitchShots: '反転までの発射回数', damage: 'ダメージ', lifetime: '寿命（秒）', homingTurnDegreesPerSecond: '追尾旋回速度（度／秒）', title: 'ステージタイトル', subtitle: 'サブタイトル', openingDuration: '開始演出（秒）', resultsDuration: 'リザルト表示（秒）', nextStageId: '次のステージ', backgroundId: 'Background', time: '出現時刻（秒）', frame: 'Frame', endFrame: '終了Frame', clock: 'Clock domain', op: 'Operation', nodeId: 'Node ID', tracks: 'Stage tracks', actions: 'Effect actions', states: 'Animation states', on: 'Semantic event', defaultState: 'Default state', enemyId: '敵', count: '出現数', spawnInterval: '出現間隔（秒）', spacingX: '横間隔', isBoss: 'ボス', emitters: 'Emitter', commands: 'Motion／Attack timeline', phases: 'Boss phases', difficultyTags: 'Difficulty tags', assetId: 'Asset', kind: '種類' };
    const allKinds = ['game', 'assets', 'program', 'variant', 'parameter-set', 'interaction', 'resource', 'rule', 'state-machine', 'actor', 'player', 'enemy', 'weapon', 'bullet', 'stage', 'stage-program', 'effect', 'animation-state', 'ship', 'projectile', 'item', 'pattern', 'boss', 'ruleset', 'difficulty', 'visual', 'audio'];
    const groupLabels = { game: 'ゲーム', assets: 'Sprite／Animation', program: 'Pattern Graph v3', variant: 'Variant v3', 'parameter-set': 'Parameter Set v3', interaction: 'Interaction v3', resource: 'Resource v3', rule: 'Rule v3', 'state-machine': 'State Machine v3', actor: 'Actor Composer v3', player: 'プレイヤー', enemy: '敵', weapon: '武器', bullet: '弾', stage: 'ステージ', 'stage-program': 'Stage Program v3', effect: 'Effect Recipe v3', 'animation-state': 'Animation State v3', ship: 'Ship v2', projectile: 'Projectile v2', item: 'Item v2', pattern: 'Pattern v2', boss: 'Boss v2', ruleset: 'RuleSet v2', difficulty: 'Difficulty v2', visual: 'Visual v2', audio: 'Audio v2' };
    const icons = { game: '▣', assets: '▦', program: '⌘', variant: '⑂', 'parameter-set': '≜', interaction: '⇄', resource: '◈', rule: '⇒', 'state-machine': '⬡', actor: '♙', player: '▲', enemy: '◆', weapon: '⌁', bullet: '●', stage: '▤', 'stage-program': '▥', effect: '✦', 'animation-state': '▶', ship: '△', projectile: '◎', item: '◇', pattern: '≋', boss: '♛', ruleset: '§', difficulty: '◒', visual: '▧', audio: '♪' };
    const referenceKinds = { playerId: 'player', stageId: 'stage', nextStageId: 'stage', stageProgramId: 'stage-program', weaponId: 'weapon', bulletId: 'bullet', projectileId: 'projectile', enemyId: 'enemy', actorId: 'enemy', bossId: 'boss', motionPatternId: 'pattern', visualId: 'visual', audioId: 'audio', bgmAudioId: 'audio' };
    const defaults = { program: { schemaVersion: 3, id: 'new-program', domain: 'projectile', parameters: {}, entryPoints: { onSpawn: [] } }, variant: { schemaVersion: 3, id: 'new-variant', bindings: [], ruleBindings: [] }, 'parameter-set': { schemaVersion: 3, id: 'new-parameters', values: {} }, interaction: { schemaVersion: 3, id: 'new-interaction', source: { team: 'player', requiredTags: [], excludedTags: [], minimumPower: 0, maximumResistance: 2147483647 }, target: { team: 'enemy', requiredTags: [], excludedTags: [], minimumPower: 0, maximumResistance: 2147483647 }, shapeTest: 'swept', priority: 0, actions: ['destroy-target'] }, resource: { schemaVersion: 3, id: 'new-resource', scope: 'run', valueType: 'number', initial: 0, minimum: 0, maximum: 100, resetPolicy: 'on-run-start' }, rule: { schemaVersion: 3, id: 'new-rule', phase: 'post-interaction', on: 'enemy-destroyed', priority: 0, actions: [{ op: 'award-score', category: 'default', base: 0 }] }, 'state-machine': { schemaVersion: 3, id: 'new-machine', scope: 'player', resourceId: '', initialStateId: 'idle', activationAction: 'special', states: [{ id: 'idle', modifiers: [], allowedActions: [], enterActions: [], tickActions: [], exitActions: [], transitions: [] }] }, actor: { schemaVersion: 3, id: 'new-actor', enemyId: '', tags: [], parts: [] }, enemy: { id: 'new-enemy', hp: 10, speed: 50, radius: 12, score: 100, movementPattern: 'straight' }, bullet: { id: 'new-bullet', speed: 300, damage: 10, radius: 4, lifetime: 4, movementPattern: 'straight' }, weapon: { id: 'new-weapon', bulletId: '', cooldown: 0.3, projectileCount: 1, spreadDegrees: 0, firePattern: 'spread' }, stage: { id: 'new-stage', events: [] }, 'stage-program': { schemaVersion: 3, id: 'new-stage-program', endFrame: 3600, tracks: [{ id: 'spawn', kind: 'spawn', clock: 'run-frame', events: [] }, { id: 'environment', kind: 'environment', clock: 'run-frame', events: [] }, { id: 'camera', kind: 'camera', clock: 'run-frame', events: [] }, { id: 'audio', kind: 'audio', clock: 'run-frame', events: [] }, { id: 'ui', kind: 'ui', clock: 'run-frame', events: [] }, { id: 'route', kind: 'route', clock: 'run-frame', events: [] }] }, effect: { schemaVersion: 3, id: 'new-effect', on: 'enemy-destroyed', priority: 0, actions: [{ type: 'particle', kind: 'destroy', count: 8, radius: 6, duration: 0.4, intensity: 1, tint: 4294967295, blend: 'additive' }] }, 'animation-state': { schemaVersion: 3, id: 'new-animation-state', defaultState: 'idle', states: { idle: 'idle' } }, ship: { schemaVersion: 2, id: 'new-ship', hitRadius: 3, grazeRadius: 20, normalSpeed: 260, focusSpeed: 130, normalWeaponIds: [], focusWeaponIds: [] }, projectile: { schemaVersion: 2, id: 'new-projectile', speed: 240, damage: 1, hitRadius: 4, lifetime: 6, visualId: 'bullet', behavior: { type: 'straight', parameters: {} } }, item: { schemaVersion: 2, id: 'new-item', kind: 'score', value: 100, visualId: 'item' }, pattern: { schemaVersion: 2, id: 'new-pattern', kind: 'attack', commands: [{ type: 'wait', parameters: { duration: 1 }, repeatCount: 1, maximumSpawnCount: 0, difficultyTags: [] }] }, boss: { schemaVersion: 2, id: 'new-boss', enemyId: '', phases: [{ id: 'phase-1', hp: 1000, timeLimit: 30, attackPatternIds: [], startProjectileCancel: 'none', endProjectileCancel: 'soft', baseBonus: 0, timeBonusPerSecond: 0 }] }, ruleset: { schemaVersion: 2, id: 'new-ruleset', stageRouteId: 'main', stageIds: [], scoreRules: [] }, difficulty: { schemaVersion: 2, id: 'new-difficulty', projectileSpeedMultiplier: 1, fireIntervalMultiplier: 1, enemyHpMultiplier: 1, additionalProjectileCount: 0, autoBomb: false, patternTags: [] }, visual: { schemaVersion: 2, id: 'new-visual', assetId: '' }, audio: { schemaVersion: 2, id: 'new-audio', assetId: 'tone://440/100', category: 'effect', baseVolume: 1, maximumInstances: 4, priority: 50 } };
    let currentPath = '', currentKind = '', definition = null, schema = null, selectedEventIndex = -1, selectedTime = null, dirty = false, mode = 'visual', catalog = [], dragging = false, previewFrame = 0, previewSeed = 0, previewDifficulty = '', previewTimer = null, assetAnimationTimer = null, previewResult = null, lastSnapshot = '', suppressHistory = false, undoStack = [], redoStack = [], selectedNodes = new Set(), nodeClipboard = [], previewOptions = { previewKind: 'stage', worldTimeScale: 1, ruleSetId: '', variantId: '', shipId: '', startStageId: '', checkpointId: '' };

    function kindForPath(path) {
      const normalized = path.replaceAll('\\', '/').toLowerCase();
      if (normalized.endsWith('/game.json') || normalized === 'game.json') return 'game';
      if (normalized.endsWith('/assets.json') || normalized === 'assets.json') return 'assets';
      if (normalized.endsWith('/player.json') || normalized === 'player.json' || normalized.startsWith('players/')) return 'player';
      for (const kind of allKinds.filter(kind => !['game', 'player'].includes(kind))) if (normalized.startsWith(`${kind}s/`)) return kind;
      return '';
    }
    function setStatus(message, success = null) { ui.status.textContent = message; ui.status.className = success === true ? 'ok' : success === false ? 'error' : ''; }
    function setDirty(value = true) { dirty = value; ui.inspectorTitle.classList.toggle('dirty', value); }
    async function api(url, options) { const response = await fetch(url, options); const value = response.headers.get('content-type')?.includes('json') ? await response.json() : await response.text(); if (!response.ok) throw new Error(value.error || value.message || value); return value; }
    async function readDefinition(path) { const loaded = await api(`/api/file?path=${encodeURIComponent(path)}`); const value = typeof loaded === 'string' ? JSON.parse(loaded) : loaded; return { value, text: `${JSON.stringify(value, null, 2)}\n` }; }

    async function refreshCatalog() {
      const paths = await api('/api/files');
      catalog = await Promise.all(paths.map(async path => { try { const { value } = await readDefinition(path); return { path, kind: kindForPath(path), id: value.id || path, value }; } catch { return { path, kind: kindForPath(path), id: path, value: null }; } }));

      if (!currentPath && catalog.length) await openFile((catalog.find(item => item.kind === 'stage') || catalog[0]).path);
    }
    function renderFiles() {
      ui.files.replaceChildren();
      for (const kind of allKinds) {
        const entries = catalog.filter(item => item.kind === kind); if (!entries.length) continue;
        const group = document.createElement('div'); group.className = 'file-group';
        const title = document.createElement('div'); title.className = 'file-group-title'; title.textContent = groupLabels[kind]; group.append(title);
        for (const item of entries) {
          const button = document.createElement('button'); button.className = `file-button${item.path === currentPath ? ' active' : ''}`; button.title = item.path;
          const icon = document.createElement('span'); icon.className = 'kind-icon'; icon.textContent = icons[kind];
          const name = document.createElement('span'); name.textContent = item.id; button.append(icon, name); button.onclick = () => openFile(item.path); group.append(button);
        }
        ui.files.append(group);
      }
    }
    async function openFile(path) {
      if (dirty && !confirm('保存していない変更を破棄しますか？')) return;

      target[name].forEach((item, index) => { const row = document.createElement('div'); row.className = 'collection-row'; row.dataset.collectionIndex = index; const title = document.createElement('strong'); title.textContent = `${index + 1}. ${item.id || item.type || 'item'}`; row.append(title); for (const [childName, childSchema] of Object.entries(itemSchema.properties)) if (!['schemaVersion'].includes(childName)) row.append(createField(childName, childSchema, item, false)); const actions = document.createElement('div'); actions.className = 'event-actions'; const up = document.createElement('button'); up.textContent = '↑'; up.disabled = index === 0; up.onclick = () => { [target[name][index - 1], target[name][index]] = [target[name][index], target[name][index - 1]]; syncJson(); render(); }; const remove = document.createElement('button'); remove.className = 'danger'; remove.textContent = '削除'; remove.onclick = () => { target[name].splice(index, 1); syncJson(); render(); }; actions.append(up, remove); row.append(actions); wrapper.append(row); });
      const add = document.createElement('button'); add.textContent = `＋ ${labels[name] || name}`; add.onclick = () => { const item = {}; for (const [childName, childSchema] of Object.entries(itemSchema.properties)) { if (childSchema.default !== undefined) item[childName] = structuredClone(childSchema.default); else if ((childSchema.type === 'array')) item[childName] = []; } if (itemSchema.required) for (const required of itemSchema.required) { const childSchema = itemSchema.properties[required]; if (item[required] === undefined) item[required] = childSchema.const ?? (childSchema.type === 'number' || childSchema.type === 'integer' ? Math.max(1, childSchema.minimum || 0) : childSchema.type === 'array' ? [] : childSchema.type === 'boolean' ? false : `new-${required}`); } target[name].push(item); syncJson(); render(); }; wrapper.append(add); return wrapper;
    }
    function createObjectField(name, property, target) {

      if (property.additionalProperties && name !== 'parameters' && !property.properties) { const input = document.createElement('textarea'); input.value = target[name] ? JSON.stringify(target[name], null, 2) : ''; input.placeholder = 'JSON object（空欄で未設定）'; input.onchange = () => { try { if (input.value.trim()) target[name] = JSON.parse(input.value); else delete target[name]; syncJson(); setStatus('Objectを更新しました。', true); } catch (error) { setStatus(`JSONを直してください: ${error.message}`, false); } }; wrapper.append(input); return wrapper; }
      if (!target[name]) target[name] = name === 'parameters' ? {} : { type: 'straight', parameters: {} }; const object = target[name];
      if (property.properties) { for (const [childName, childSchema] of Object.entries(property.properties)) wrapper.append(createField(childName, childSchema, object, false)); return wrapper; }
      const isParameterMap = name === 'parameters'; if (!isParameterMap) { const type = document.createElement('input'); type.placeholder = 'capability type'; type.value = object.type || ''; type.oninput = () => { object.type = type.value; syncJson(); }; wrapper.append(type); } const params = isParameterMap ? object : object.parameters || (object.parameters = {}); for (const [key, value] of Object.entries(params)) { const row = document.createElement('div'); row.className = 'collection-row'; const keyInput = document.createElement('input'); keyInput.value = key; keyInput.placeholder = 'parameter'; row.append(keyInput); if (key === 'points' && Array.isArray(value)) { const caption = document.createElement('small'); caption.textContent = 'Motion path control points'; row.append(caption); value.forEach((point, pointIndex) => { const x = document.createElement('input'), y = document.createElement('input'); x.type = y.type = 'number'; x.value = point.x; y.value = point.y; x.setAttribute('aria-label', `control point ${pointIndex + 1} x`); y.setAttribute('aria-label', `control point ${pointIndex + 1} y`); x.oninput = () => { point.x = Number(x.value); syncJson(); }; y.oninput = () => { point.y = Number(y.value); syncJson(); }; row.append(x, y); }); const addPoint = document.createElement('button'); addPoint.textContent = '＋ Control point'; addPoint.onclick = () => { value.push({ x: 0, y: 0 }); syncJson(); renderInspector(); }; row.append(addPoint); } else { const valueInput = document.createElement('input'); valueInput.value = JSON.stringify(value); valueInput.placeholder = 'value'; const update = () => { const nextKey = keyInput.value.trim(); if (nextKey !== key) delete params[key]; if (nextKey) { try { params[nextKey] = JSON.parse(valueInput.value); } catch { params[nextKey] = valueInput.value; } } syncJson(); }; keyInput.onchange = update; valueInput.oninput = update; row.append(valueInput); } wrapper.append(row); }

    function smartStep(name) { return ['cooldown', 'lifetime', 'invincibilitySeconds', 'openingDuration', 'resultsDuration', 'spawnInterval', 'movementFrequency', 'time', 'rotationDegreesPerShot', 'homingTurnDegreesPerSecond'].includes(name) ? '0.1' : '1'; }
    function renderPreviewOnly() { const canvas = ui.visualView.querySelector('canvas'); if (!canvas) return; if (currentKind === 'stage') drawStage(canvas); else paintDefinitionPreview(canvas); }
    function updateTimeline() { const timeline = ui.visualView.querySelector('#timeline'); if (timeline) populateTimeline(timeline); }
    function addStageEvent() { const firstEnemy = catalog.find(item => item.kind === 'enemy')?.id || '', time = selectedTime ?? (definition.events.length ? Math.max(...definition.events.map(event => Number(event.time) || 0)) + 5 : 0); definition.events.push({ time, type: 'spawn-enemy', enemyId: firstEnemy, x: Math.round(gameSize().width / 2), y: 100 }); selectedEventIndex = definition.events.length - 1; selectedTime = time; syncJson(); render(); }
    function duplicateStageEvent() { const copy = structuredClone(definition.events[selectedEventIndex]); definition.events.splice(selectedEventIndex + 1, 0, copy); selectedEventIndex += 1; selectedTime = Number(copy.time); syncJson(); render(); }
    function removeStageEvent() { if (selectedEventIndex < 0 || !confirm('選択中の出現イベントを削除しますか？')) return; definition.events.splice(selectedEventIndex, 1); const sameTimeIndex = definition.events.findIndex(stageEvent => sameStageTime(stageEvent, selectedTime)); selectedEventIndex = sameTimeIndex >= 0 ? sameTimeIndex : Math.min(selectedEventIndex, definition.events.length - 1); selectedTime = selectedEventIndex >= 0 ? Number(definition.events[selectedEventIndex].time) : null; syncJson(); render(); }
    function renderSchemaReference() { ui.schema.replaceChildren(); if (!schema) return; const required = new Set(schema.required || []); for (const [name, property] of Object.entries(schema.properties || {})) { const row = document.createElement('div'); row.className = 'schema-field'; const code = document.createElement('code'); code.textContent = name; row.append(code); if (required.has(name)) { const mark = document.createElement('span'); mark.className = 'required'; mark.textContent = ' 必須'; row.append(mark); } const type = document.createElement('div'); type.textContent = Array.isArray(property.type) ? property.type.join(' | ') : property.type || 'value'; row.append(type); ui.schema.append(row); } }
    function requestBody() { const path = ui.path.value.trim(); if (!path) throw new Error('JSONの保存先を入力してください。'); if (mode === 'visual') syncJson(false); else definition = JSON.parse(ui.content.value); return { path, content: ui.content.value }; }

    const kindDirectories = { program: 'programs', variant: 'variants', 'parameter-set': 'parameter-sets', interaction: 'interactions', resource: 'resources', rule: 'rules', 'state-machine': 'state-machines', actor: 'actors', enemy: 'enemies', bullet: 'bullets', weapon: 'weapons', stage: 'stages', 'stage-program': 'stage-programs', effect: 'effects', 'animation-state': 'animation-states', ship: 'ships', projectile: 'projectiles', item: 'items', pattern: 'patterns', boss: 'bosses', ruleset: 'rulesets', difficulty: 'difficulties', visual: 'visuals', audio: 'audio' };
    document.querySelector('#new').onclick = async () => { if (dirty && !confirm('保存していない変更を破棄しますか？')) return; const kind = document.querySelector('#newType').value, id = prompt(`${groupLabels[kind]}のIDを入力してください`, defaults[kind].id); if (!id) return; currentKind = kind; currentPath = `${kindDirectories[kind]}/${id}.json`; definition = structuredClone(defaults[kind]); definition.id = id; if (kind === 'weapon') definition.bulletId = catalog.find(item => item.kind === 'bullet')?.id || ''; if (kind === 'boss' || kind === 'actor') definition.enemyId = catalog.find(item => item.kind === 'enemy')?.id || ''; if (kind === 'ship') { const weapon = catalog.find(item => item.kind === 'weapon')?.id || ''; definition.normalWeaponIds = [weapon]; definition.focusWeaponIds = [weapon]; } ui.path.value = currentPath; schema = await api(`/api/schema?path=${encodeURIComponent(currentPath)}`); selectedEventIndex = -1; selectedTime = null; undoStack = []; redoStack = []; lastSnapshot = JSON.stringify(definition); syncJson(false); showMode('visual'); render(); setDirty(); updateHistoryButtons(); setStatus(`新しい${groupLabels[kind]}を編集中です。保存するまでファイルは作成されません。`); };

    document.querySelector('#rename').onclick = async () => { if (!currentPath || dirty) { setStatus('ID変更前に現在の編集を保存してください。', false); return; } const newId = prompt('新しいID（参照も一括更新）', definition.id); if (!newId) return; const result = await api('/api/rename', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: currentPath, newId }) }); setStatus(result.message, result.success); if (result.success) { await refreshCatalog(); await openFile(currentPath); } };

    document.querySelector('#validate').onclick = async () => { try { const result = await api('/api/validate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestBody()) }); setStatus(result.message, result.success); } catch (error) { setStatus(error.message, false); } };
    document.querySelector('#save').onclick = async () => { try { const result = await api('/api/file', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestBody()) }); setStatus(result.message, result.success); if (result.success) { currentPath = ui.path.value.trim(); setDirty(false); await refreshCatalog(); } } catch (error) { setStatus(error.message, false); } };
